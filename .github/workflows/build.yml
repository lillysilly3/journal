name: Build Journal App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed main.py
      - name: Rename
        run: mv dist/main dist/Journal
      - name: Zip with install script
        run: zip Journal-linux.zip dist/Journal install.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal-linux
          path: Journal-linux.zip


  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal-windows
          path: dist/main.exe


  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed main.py
      - name: Rename
        run: mv dist/main dist/Journal-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal-macos
          path: dist/Journal-macos


  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Journal-linux/Journal-linux.zip
            artifacts/Journal-windows/main.exe
            artifacts/Journal-macos/Journal-macos
